{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<style>
  body {
    font-family: 'Helvetica Neue', sans-serif;
    background-color: #f8f9fa;
  }

  .project-container {
    max-width: 900px;
    margin: 3rem auto;
    background-color: white;
    border-radius: 10px;
    padding: 2.5rem;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  .project-title {
    font-size: 2.8rem;
    font-weight: 700;
    color: #343a40;
    margin-bottom: 1rem;
  }

  .project-description {
    font-size: 1.15rem;
    line-height: 1.8;
    color: #555;
  }

  .project-links {
    margin-top: 2rem;
  }

  .project-links a {
    display: inline-block;
    margin-right: 1rem;
    padding: 0.6rem 1.2rem;
    background-color: #0069d9;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    transition: background-color 0.3s ease;
  }

  .project-links a:hover {
    background-color: #004999;
  }
</style>

<div class="project-container">
  <h1 class="project-title">{{ page.title }}</h1>

  <div class="project-description">
    {{ page.description|richtext }}
  </div>

  <div class="project-links">
    {% if page.github_url %}
      <a href="{{ page.github_url|striptags }}" target="_blank">GitHub Repo</a>
    {% endif %}
    {% if page.demo_url %}
      <a href="{{ page.demo_url|striptags }}" target="_blank">Live Demo</a>
    {% endif %}
  </div>
</div>
{% endblock %}
